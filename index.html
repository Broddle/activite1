<style>

t:650}.room-btn.current{background:#183c40;border-color:var(--mint);box-shadow:inset 3px 0 var(--mint)}.room-btn .num{color:var(--mint);font-size:.78rem}.room-btn.locked{color:#71839a}.hud{background:#091623;border:1px solid var(--line);border-radius:13px;padding:13px;margin-top:12px}.fragment{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.digit{border:1px solid #36556d;background:#172a3c;width:33px;height:39px;display:grid;place-items:center;border-radius:7px;color:var(--mint);font-weight:900;font-size:1.2rem}.digit.empty{color:#6b829b}.main{min-width:0}.screen{background:linear-gradient(135deg,rgba(19,38,57,.97),rgba(10,19,32,.98));border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 14px 50px #0005;padding:clamp(18px,3vw,34px);min-height:650px}.eyebrow{text-transform:uppercase;color:var(--mint);letter-spacing:.16em;font-weight:850;font-size:.73rem}h1{font-size:clamp(2.1rem,5vw,4.1rem);line-height:1.1;margin:10px 0 16px;letter-spacing:-.045em}h2{font-size:clamp(1.45rem,2.7vw,2.3rem);line-height:1.2;margin:8px 0 12px}h3{font-size:1.08rem;margin:0 0 10px}.lead{color:#c3d5e6;font-size:1.1rem;max-width:760px}.notice{border:1px solid #537387;background:#13293a;padding:15px;border-radius:12px;margin:18px 0}.notice.red{border-color:#6b3b4a;background:#331d2b}.notice.good{border-color:#287b6d;background:#10352e}.btn{padding:11px 17px;border-radius:10px;border:1px solid #60859b;background:#23374c;color:#f0f9ff;font-weight:760;transition:.14s}.btn:hover:not(:disabled){filter:brightness(1.18);transform:translateY(-1px)}.btn.primary{background:var(--mint);color:#08251f;border-color:var(--mint)}.btn.warn{border-color:#ad6772;color:#ffc4ce;background:#442531}.btn.ghost{background:transparent}.btn.smallbtn{padding:7px 10px;font-size:.86rem}.btn.correct{background:#17483d;border-color:var(--mint)}.btn.bad{background:#43212d;border-color:var(--red)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px;margin:17px 0}.card{border:1px solid var(--line);background:#0e1b2d;padding:17px;border-radius:12px}.card strong{display:block;font-size:1.18rem;margin:4px 0}.card .icon{font-size:1.55rem}.task-head{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}.task-pips{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.pip{width:31px;height:7px;border-radius:4px;background:#31445a}.pip.done{background:var(--mint)}.pip.active{background:var(--amber)}.work{padding:19px;background:#0b1929;border:1px solid #2e4860;border-radius:13px;margin-top:18px}.work p:first-child{margin-top:0}.options{display:grid;gap:9px;margin:12px 0}.option{display:flex;gap:10px;align-items:center;padding:12px;text-align:left;border:1px solid #436079;border-radius:10px;background:#1b2d43;color:#f0f6ff}.option:hover{border-color:var(--mint)}.option.selected{background:#173c3e;border-color:var(--mint)}.option .n{font-weight:850;color:var(--mint)}.field{width:100%;padding:12px;border-radius:9px;background:#06111d;color:#eff9ff;border:1px solid #63819a;margin:7px 0}.field:focus,.option:focus-visible,.btn:focus-visible,.room-btn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}.feedback{margin-top:13px;padding:12px 14px;border-radius:10px;border:1px solid #536b83;background:#213349}.feedback.ok{background:#103a34;border-color:#288b71;color:#b4ffe7}.feedback.no{background:#442632;border-color:#a55766;color:#ffd2db}.hint-area{border-top:1px dashed #456079;padding-top:14px;margin-top:20px}.hint{border-left:3px solid var(--amber);padding:9px 12px;background:#392f25;color:#ffe6bf;margin:8px 0;border-radius:0 7px 7px 0}.tag{font-size:.8rem;padding:5px 10px;background:#1f394b;color:#b9e8ee;border:1px solid #426575;border-radius:50px}.metric{font-variant-numeric:tabular-nums}.file-list{display:grid;gap:8px}.file-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(110px,180px);gap:12px;align-items:center;background:#1a2a3e;border:1px solid #344d64;padding:9px;border-radius:9px}.file-row select{width:100%;background:#0d1b2c;color:var(--text);border:1px solid #65829b;padding:8px;border-radius:8px}.path{display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-family:ui-monospace,monospace;background:#071321;padding:12px;border-radius:8px;color:var(--mint)}.robotboard{display:grid;grid-template-columns:repeat(6,minmax(35px,58px));gap:5px;justify-content:start;margin:18px 0}.cell{aspect-ratio:1;background:#192c42;border:1px solid #47617a;display:grid;place-items:center;border-radius:7px;font-size:1.5rem}.cell.wall{background:repeating-linear-gradient(45deg,#2c3447,#2c3447 7px,#41516a 7px,#41516a 12px)}.cell.goal{background:#244b43}.cell.robot{background:#244064;outline:2px solid var(--blue)}.command{font-family:ui-monospace,monospace;background:#0b1827;border:1px solid #41647c;color:var(--mint);border-radius:9px;padding:9px 13px;font-weight:900}.terminal{font-family:ui-monospace,Consolas,monospace;background:#040d15;border:1px solid #335565;border-radius:10px;padding:17px;color:#75ead0;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere}.shake{animation:shake .25s}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.victory{text-align:center;padding:30px 12px}.victory .medal{font-size:5rem}.foot{margin:18px 0;color:#90a7b9;font-size:.82rem;text-align:center}.toggle{display:flex;align-items:center;gap:8px}.stars{color:var(--amber)}.summarygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:18px 0}.summarygrid>div{border:1px solid var(--line);border-radius:12px;padding:15px;background:#12263a}.summarygrid strong{display:block;font-size:1.6rem}.choicegroup{display:grid;gap:10px}.question{padding:14px;background:#14273b;border:1px solid #37526b;border-radius:11px;margin:9px 0}.question p{margin:0 0 8px}.warning{color:var(--amber)}.escape-icon{filter:drop-shadow(0 0 15px #ec637f)}@media(max-width:880px){.layout{grid-template-columns:1fr}.side{position:static}.list{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.side .hud{display:none}.screen{min-height:500px}}@media(max-width:500px){.app{padding:9px}.top{align-items:start}.brand{font-size:1rem}.status{font-size:.65rem}.screen{padding:15px}.file-row{grid-template-columns:1fr}.robotboard{grid-template-columns:repeat(6,minmax(34px,1fr))}.cell{font-size:1.2rem}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.audit-head{border:1px solid #a76a46;background:linear-gradient(110deg,#381d24,#162238);border-radius:14px;padding:16px;margin:12px 0 20px}.audit-head strong{color:#ffd18b}.audit-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px}.audit-card{padding:13px;border:1px solid #466078;border-radius:10px;background:#0b1a2b}.audit-card strong{display:block;color:#72e3d0}.audit-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.audit-chips span{border:1px solid #496783;border-radius:6px;padding:6px 9px;background:#0b1726;font-family:monospace}.audit-hint{border-left:3px solid #e9b86e;background:#2c2b32;padding:11px;margin-top:10px;border-radius:5px}.audit-answer{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:15px}.audit-answer input{max-width:370px;flex:1}.overline{font-size:.76rem;letter-spacing:.13em;color:var(--amber);font-weight:800}.sector-note{border:1px solid #305e59;border-radius:9px;padding:10px;margin-top:12px;color:#a5efdf}

<body><div id="app" class="app"></div>
<script>
'use strict';
/* Toute la progression reste en mémoire vive uniquement. Aucun stockage local ni requête externe. */
const rooms=[
 {name:'Archives corrompues',short:'Fichiers',icon:'🗂️',fragment:'8',tasks:4,minutes:20,skill:'Dossiers, types de fichiers et organisation'},
 {name:'Transmission secrète',short:'Cryptage',icon:'🔐',fragment:'3',tasks:4,minutes:20,skill:'Codes, logique et représentations'},
 {name:'Réseau contaminé',short:'Sécurité',icon:'🛡️',fragment:'6',tasks:4,minutes:20,skill:'Phishing, adresses et mots de passe'},
 {name:'Robot de maintenance',short:'Robot',icon:'🤖',fragment:'1',tasks:4,minutes:25,skill:'Déplacements, algorithmes et débogage'},
 {name:'Cœur de NEXUS',short:'Contrôle',icon:'⚡',fragment:'4',tasks:4,minutes:20,skill:'Tableaux, calculs et déduction'}
];
const taskTitles=[['Triage d’urgence','Chemin des archives','Extensions sabotées','Dossier confidentiel'],['Alphabet numérique','Le signal binaire','La séquence oubliée','Carte de déchiffrement'],['Courriel piégé','Adresses Internet','Coffre à mots de passe','Protocole de sécurité'],['Piloter le robot','Déboguer une commande','Optimiser une boucle','Le journal de bord'],['Consommation énergétique','Ordre des interrupteurs','Clés de secours','Code de déverrouillage']];
const hints=[
 [
 ['L’extension est la partie après le point.','.png et .jpg sont des images ; .mp3 du son ; .pdf et .docx des documents ; .mp4 de la vidéo.','Il faut classer : rapport → Documents, portrait → Images, alerte → Audio, plan → Images, consignes → Documents, caméra → Vidéos.'],
 ['Lis la mission : on cherche un rapport, pas une image.','Ouvre successivement le dossier qui parle de documents, puis celui du laboratoire.','Le chemin correct est Documents → Laboratoire → rapports → journal.txt.'],
 ['Ne change pas le contenu des fichiers, seulement leur extension.','.jpg = image ; .mp3 = son ; .pdf = document ; .mp4 = vidéo.','Les quatre réponses sont .jpg, .mp3, .pdf, .mp4 dans cet ordre.'],
 ['Un fichier confidentiel ne doit pas être accessible à tout le monde.','Compare les droits : lecteur, éditeur, public.','Choisis la solution qui limite l’accès au seul personnel autorisé.']
 ],
 [
 ['A=1, B=2, C=3…','14 correspond à N ; 5 correspond à E.','14-5-24-21-19 donne NEXUS.'],
 ['En binaire, chaque colonne correspond à 8, 4, 2, 1.','Additionne seulement les valeurs des cases contenant 1.','1010 = 8+2 = 10, 0110 = 4+2 = 6, 1001 = 8+1 = 9.'],
 ['Observe l’écart entre deux nombres successifs.','Les différences augmentent : +2, +4, +6, +8…','La suite 3, 5, 9, 15, 23, ? donne 33.'],
 ['Lis chaque coordonnée comme colonne, puis ligne.','A1 est tout en haut à gauche.','B2 = R, D1 = A, A3 = D, C3 = I, E2 = O → RADIO.']
 ],
 [
 ['Les escrocs insistent souvent sur l’urgence ou un prix trop beau.','Cherche les demandes de secret, les liens suspects et les menaces.','Coche : urgence, mot de passe, expéditeur étrange, lien inhabituel.'],
 ['Le véritable nom de domaine se lit avant le premier / et avant les sous-chemins.','Une imitation peut placer le nom connu avant un autre domaine.','Le site authentique proposé est https://www.bibliotheque.be/moncompte.'],
 ['La longueur et l’originalité sont essentielles.','Une phrase de passe longue est généralement meilleure qu’un mot court avec un symbole.','Choisis : Train-Orange-Lune-Papillon-72.'],
 ['Pour un lien suspect, ne clique pas et ne fournis pas d’informations.','Signale le message à une personne responsable ou via le canal officiel.','Ordre : ne pas cliquer → vérifier via le site officiel → signaler → supprimer.']
 ],
 [
 ['Les flèches montrent l’orientation du robot. A avance, G tourne à gauche, D à droite.','Prépare la route sur papier avant de saisir les commandes.','Le robot peut d’abord tourner à droite, avancer 5 cases, tourner à gauche et avancer 4 cases : D A A A A A G A A A A.'],
 ['Le robot doit tourner AVANT de se déplacer sur le côté.','Une commande A ne modifie pas son orientation.','Pour tourner à droite, avancer deux cases, puis tourner à gauche : D A A G.'],
 ['Une boucle évite de recopier plusieurs fois la même instruction.','Pour avancer 4 fois, on peut répéter A quatre fois.','La solution la plus courte est RÉPÉTER 4 FOIS : A.'],
 ['Observe les étapes d’un programme fiable.','On prépare avant d’exécuter ; on teste avant de valider.','Ordre : analyser → programmer → tester → corriger.']
 ],
 [
 ['Additionne les consommations de chaque appareil allumé.','Serveur = 120, écrans = 35 chacun, ventilation = 50, robot = 75.','2 écrans + serveur + ventilation + robot = 120+70+50+75 = 315 W.'],
 ['Certaines règles imposent de faire une action avant une autre.','On doit alimenter le serveur avant d’activer le réseau.','Séquence : batterie → serveur → réseau → porte.'],
 ['La clé cherchée respecte toutes les conditions en même temps.','Elle contient 4 chiffres, débute par un chiffre pair, et sa somme vaut 14.','Parmi les clés proposées, 2435 est valide : 2+4+3+5 =14.'],
 ['Tu as obtenu un chiffre par salle.','Il faut les placer dans l’ordre des salles, pas dans l’ordre de ton choix.','Le code à 5 chiffres est 83614.']
 ]
];
let state={started:false,room:0,task:0,solved:Array.from({length:5},()=>[false,false,false,false]),audit:Array.from({length:5},()=>[false,false]),auditRoom:null,auditStep:0,hint:{},answers:{},feedback:null,complete:false,startedAt:Date.now(),gameEnd:null,robot:null,robotHistory:[],sound:false,expertDone:[false,false,false,false,false],expertRoom:null};
const $=sel=>document.querySelector(sel);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function countDone(){return state.solved.flat().filter(Boolean).length+state.audit.flat().filter(Boolean).length;}
function totalDone(){return countDone()+state.expertDone.filter(Boolean).length;}
function roomDone(r){return state.solved[r].every(Boolean)&&state.audit[r].every(Boolean)}
function isRoomUnlocked(r){return r===0||roomDone(r-1)}
function activeKey(){return `${state.room}-${state.task}`}
function val(key,def=''){return state.answers[key]??def}
function setAnswer(key,v){state.answers[key]=v}
function progress(){return Math.round(totalDone()/35*100)}
function elapsed(){return Math.round((Date.now()-state.startedAt)/60000)}
function jump(r,t=0){if(!isRoomUnlocked(r))return;state.auditRoom=null;state.expertRoom=null;state.room=r;state.task=t;state.feedback=null;render();window.scrollTo({top:0,behavior:'smooth'})}
function next(){const r=state.room,t=state.task;if(t<3)jump(r,t+1);else openAudit(r,0)}
function setFeedback(ok,message){state.feedback={ok,message};render();}
function pass(message){state.solved[state.room][state.task]=true;state.feedback={ok:true,message:message||'Mission réussie. Protocole accepté.'};render();}
function boxButton(label,fn='check()',cls='primary'){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}
function choice(name,options){let selected=val(activeKey()+':'+name);return `<div class="options">${options.map((o,i)=>`<button class="option ${selected===i?'selected':''}" onclick="pick('${name}',${i})"><span class="n">${'ABCD'[i]}.</span><span>${esc(o)}</span></button>`).join('')}</div>`}
function pick(name,i){setAnswer(activeKey()+':'+name,i);state.feedback=null;render()}
function input(name,placeholder='Saisis ta réponse ici…',type='text'){return `<input class="field" type="${type}" id="entry" value="${esc(val(activeKey()+':'+name))}" placeholder="${esc(placeholder)}" autocomplete="off" oninput="setAnswer('${activeKey()+':'+name}',this.value)" onkeydown="if(event.key==='Enter')check()">`}
function currentChoice(name){return val(activeKey()+':'+name,-1)}
function currentText(name){return String(val(activeKey()+':'+name)).trim().toUpperCase().replace(/\s+/g,' ')}
function render(){const root=$('#app');root.innerHTML=`
<header class="top"><div class="brand"><span class="brand-mark">⌘</span><div>OPÉRATION <span style="color:var(--mint)">BLACKOUT</span><div class="tiny">PROJET NEXUS · LABORATOIRE 07</div></div></div><span class="status">● ${state.complete?'SYSTÈME RÉTABLI':'ALERTE : VERROUILLAGE ACTIF'}</span></header>
<div class="layout"><aside class="side"><div class="tiny">TABLEAU DE BORD</div><div class="row between"><strong>${totalDone()} / 35 objectifs</strong><span class="small metric">${progress()} % des missions</span></div><div class="progress" aria-label="Progression"><div style="width:${progress()}%"></div></div><div class="small">${state.expertDone.filter(Boolean).length}/5 défis experts validés. Progression non enregistrée. Ne recharge pas la page pendant le jeu.</div><div class="list">${rooms.map((r,i)=>`<button class="room-btn ${state.room===i&&state.started&&!state.complete?'current':''} ${!isRoomUnlocked(i)?'locked':''}" ${!isRoomUnlocked(i)||!state.started?'disabled':''} onclick="jump(${i},0)"><span class="num">${roomDone(i)?'✓':isRoomUnlocked(i)?String(i+1).padStart(2,'0'):'🔒'}</span><span>${esc(r.short)}<span style="display:block;font-size:.73rem;color:#93adc1">${state.solved[i].filter(Boolean).length+state.audit[i].filter(Boolean).length}/6 tâches ${state.expertDone[i]?'· ★':''}</span></span></button>`).join('')}</div><div class="hud"><div class="tiny">FRAGMENTS DE CODE</div><div class="fragment">${rooms.map((r,i)=>`<div class="digit ${roomDone(i)?'':'empty'}" title="Salle ${i+1}">${roomDone(i)?r.fragment:'?'}</div>`).join('')}</div></div><div class="row" style="margin-top:14px"><button class="btn smallbtn ghost" onclick="showHelp()">❔ Comment jouer</button><button class="btn smallbtn ghost" onclick="restartAsk()">↻ Recommencer</button></div></aside>
<main class="main"><div class="screen">${!state.started?intro():state.complete?victory():state.auditRoom!==null?auditScreen():state.expertRoom!==null?expertScreen():taskScreen()}</div><div class="foot">Escape game pédagogique · Un seul fichier HTML · Aucune sauvegarde locale ni compte nécessaire</div></main></div>`}
function intro(){return `<div class="eyebrow">⚠ CONNECTION INTERROMPUE — 07:42</div><h1>LE LABORATOIRE<br><span style="color:var(--red)">EST VERROUILLÉ.</span></h1><p class="lead">Une intelligence artificielle appelée <strong>NEXUS</strong> a pris le contrôle des installations. Les portes sont fermées et cinq systèmes de sécurité empêchent votre sortie.</p><div class="terminal">&gt; SIGNAL D'URGENCE REÇU<br>&gt; ACCÈS TECHNICIEN : BLOQUÉ<br>&gt; FRAGMENTS DE CODE : 0 / 5<br>&gt; MISSION : RÉTABLIR LE CONTRÔLE</div><div class="cards"><div class="card"><div class="icon">🧩</div><strong>30 épreuves + 5 bonus</strong><div class="small">4 consoles + 2 protocoles renforcés par salle et un défi expert facultatif</div></div><div class="card"><div class="icon">⏱️</div><strong>Objectif : 2 h</strong><div class="small">Défis progressifs, sans élimination</div></div><div class="card"><div class="icon">🆘</div><strong>3 indices</strong><div class="small">À débloquer si tu restes bloqué</div></div></div><div class="notice"><strong>Consignes du laboratoire :</strong> lis attentivement, cherche les indices, essaie plusieurs solutions et discute avec ton binôme si nécessaire. Aucune compétence préalable n'est nécessaire. Ne recharge pas la page : rien n'est sauvegardé.</div><div class="row"><button class="btn primary" onclick="start()">▶ ENTRER DANS LE LABORATOIRE</button><button class="btn ghost" onclick="showHelp()">Comment jouer ?</button></div>`}
function start(){state.started=true;state.startedAt=Date.now();render()}

function check(){const r=state.room,t=state.task,k=activeKey();let ok=false,why='Réponse incorrecte. Réexamine les indices et essaie encore.';

if(r===2&&t===2)ok=currentChoice('password')===2;
if(r===2&&t===3)ok=[1,2,3,4].every((n,i)=>val(k+':step'+i)===String(n));
if(r===3&&t===1)ok=currentChoice('debug')===1;
if(r===3&&t===2)ok=currentChoice('loop')===1;
if(r===3&&t===3)ok=[2,3,1,4].every((n,i)=>val(k+':order'+i)===String(n));
if(r===4&&t===0)ok=currentText('watt')==='315';
if(r===4&&t===1)ok=[3,1,4,2].every((n,i)=>val(k+':power'+i)===String(n));
if(r===4&&t===2)ok=currentChoice('key')===0;
if(r===4&&t===3)ok=currentText('final')==='83614';
if(ok)pass(r===4&&t===3?'Code accepté ! NEXUS a été neutralisée.':'Réponse exacte ! Accès à la console suivante autorisé.');else setFeedback(false,why);
}
const walls=new Set(['1,3','2,3','2,2','3,2','4,2','1,1','4,1','4,0']);
function robotGrid(bot){let html='<div class="robotboard" role="img" aria-label="Grille de six colonnes sur cinq lignes, avec obstacles et objectif">';for(let y=0;y<5;y++)for(let x=0;x<6;x++){let wall=walls.has(x+','+y),goal=x===5&&y===0,robot=bot.x===x&&bot.y===y;html+=`<div class="cell ${wall?'wall':''} ${goal?'goal':''} ${robot?'robot':''}" title="Colonne ${x+1}, ligne ${y+1}">${robot?['⬆️','➡️','⬇️','⬅️'][bot.d]:wall?'▨':goal?'⚡':''}</div>`}return html+'</div>'}
function robotAdd(c){if(state.robot.commands.length>=24){setFeedback(false,'La console accepte au maximum 24 commandes. Essaie une autre stratégie.');return}state.robot.commands.push(c);state.feedback=null;render()}
function robotUndo(){state.robot.commands.pop();state.feedback=null;render()}
function robotClear(){state.robot={x:0,y:4,d:0,commands:[],running:false};state.feedback=null;render()}
function robotRun(){let b=state.robot,dirs=[[0,-1],[1,0],[0,1],[-1,0]],x=0,y=4,d=0,invalid=false;for(const c of b.commands){if(c==='G')d=(d+3)%4;else if(c==='D')d=(d+1)%4;else{const xx=x+dirs[d][0],yy=y+dirs[d][1];if(xx<0||xx>5||yy<0||yy>4||walls.has(xx+','+yy)){invalid=true;break}x=xx;y=yy}}if(!invalid&&x===5&&y===0){state.robot={...b,x,y,d};pass('Trajet réussi ! Le panneau électrique est reconnecté.')}else{state.robot={...b,x:0,y:4,d:0};setFeedback(false,invalid?'Collision ou sortie de la grille : corrige ta séquence puis réessaie.':'Le robot ne termine pas sur le panneau ⚡. Vérifie ton chemin.')}}
render();
